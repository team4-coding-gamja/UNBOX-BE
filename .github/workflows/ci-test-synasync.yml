name: Test Services - Sync/Async CI/CD
# 동기/비동기 테스트용 CI/CD 파이프라인

on:
  push:
    branches:
      - test/syn-async
    paths:
      - 'unbox_order/**'
      - 'unbox_payment/**'
      - 'unbox_product/**'
      - 'unbox_trade/**'
      - 'unbox_user/**'
      - 'unbox_common/**'
      - '.github/workflows/ci-test-synasync.yml'

  workflow_dispatch:
    inputs:
      services:
        description: '빌드할 서비스 선택 (쉼표로 구분, 전체: all)'
        required: false
        default: 'all'
        type: string

env:
  AWS_REGION: ap-northeast-2

jobs:
  # ============================================
  # Job 1: 변경된 서비스 감지
  # ============================================
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.changes.outputs.services }}
      matrix: ${{ steps.changes.outputs.matrix }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed services
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SELECTED_SERVICES="${{ github.event.inputs.services }}"
            SERVICES=$([ "$SELECTED_SERVICES" = "all" ] || [ -z "$SELECTED_SERVICES" ] && echo "order,payment,product,trade,user" || echo "$SELECTED_SERVICES")
          else
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
            SERVICES=""
            COMMON_CHANGED=$(echo "$CHANGED_FILES" | grep -q "unbox_common/" && echo true || echo false)
            
            [[ $(echo "$CHANGED_FILES" | grep "unbox_order/") || "$COMMON_CHANGED" == "true" ]] && SERVICES+="order,"
            [[ $(echo "$CHANGED_FILES" | grep "unbox_payment/") || "$COMMON_CHANGED" == "true" ]] && SERVICES+="payment,"
            [[ $(echo "$CHANGED_FILES" | grep "unbox_product/") || "$COMMON_CHANGED" == "true" ]] && SERVICES+="product,"
            [[ $(echo "$CHANGED_FILES" | grep "unbox_trade/") || "$COMMON_CHANGED" == "true" ]] && SERVICES+="trade,"
            [[ $(echo "$CHANGED_FILES" | grep "unbox_user/") || "$COMMON_CHANGED" == "true" ]] && SERVICES+="user,"
            [[ $(echo "$CHANGED_FILES" | grep ".github/workflows/ci-test-synasync.yml") ]] && SERVICES="order,payment,product,trade,user"
            
            SERVICES=$(echo "$SERVICES" | sed 's/,$//')
          fi
          
          echo "services=$SERVICES" >> $GITHUB_OUTPUT
          
          if [ -z "$SERVICES" ]; then
            echo "matrix={\"include\":[]}" >> $GITHUB_OUTPUT
          else
            MATRIX_JSON="{\"include\":["
            IFS=',' read -ra SERVICE_ARRAY <<< "$SERVICES"
            for i in "${!SERVICE_ARRAY[@]}"; do
              SERVICE="${SERVICE_ARRAY[$i]}"
              [ $i -gt 0 ] && MATRIX_JSON+=","
              case $SERVICE in
                "order")   MATRIX_JSON+="{\"service\":\"order\",\"path\":\"unbox_order\",\"repo\":\"unbox-dev-order-repo\"}" ;;
                "payment") MATRIX_JSON+="{\"service\":\"payment\",\"path\":\"unbox_payment\",\"repo\":\"unbox-dev-payment-repo\"}" ;;
                "product") MATRIX_JSON+="{\"service\":\"product\",\"path\":\"unbox_product\",\"repo\":\"unbox-dev-product-repo\"}" ;;
                "trade")   MATRIX_JSON+="{\"service\":\"trade\",\"path\":\"unbox_trade\",\"repo\":\"unbox-dev-trade-repo\"}" ;;
                "user")    MATRIX_JSON+="{\"service\":\"user\",\"path\":\"unbox_user\",\"repo\":\"unbox-dev-user-repo\"}" ;;
              esac
            done
            echo "matrix=${MATRIX_JSON}]}" >> $GITHUB_OUTPUT
          fi

  # ============================================
  # Job 2: 서비스별 병렬 빌드 및 푸시
  # ============================================
  build:
    name: Build ${{ matrix.service }} (test-synasync)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.services != ''
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
      fail-fast: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DEV_IAM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.path }}/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.repo }}:test-synasync-${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.repo }}:test-synasync-latest

  # ============================================
  # Job 3: 인프라 레포 업데이트 (GitOps 연결)
  # ============================================
  deploy-update:
    name: Update Infra Manifests
    runs-on: ubuntu-latest
    needs: [detect-changes, build]
    if: success()
    steps:
      - name: Checkout Infrastructure Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Unbox-infra
          token: ${{ secrets.INFRA_REPO_PAT }}
          path: Unbox-infra
          ref: feat/ArgoCD-dev-synasync

      - name: Update Image Tags with yq
        run: |
          SERVICES="${{ needs.detect-changes.outputs.services }}"
          IMAGE_TAG="test-synasync-${{ github.sha }}"
          
          IFS=',' read -ra SERVICE_ARRAY <<< "$SERVICES"
          cd Unbox-infra/gitops/apps
          
          for SERVICE in "${SERVICE_ARRAY[@]}"; do
            TARGET_FILE="$SERVICE/values-dev-synasync.yaml"
            if [ -f "$TARGET_FILE" ]; then
              yq e ".image.tag = \"$IMAGE_TAG\"" -i "$TARGET_FILE"
              echo "✅ Updated $TARGET_FILE with tag $IMAGE_TAG"
            else
              echo "⚠️ Warning: $TARGET_FILE not found!"
            fi
          done

      - name: Commit and Push Changes
        run: |
          cd Unbox-infra
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "deploy(test-synasync): update images [${{ needs.detect-changes.outputs.services }}] [skip ci]"
            git push origin feat/ArgoCD-dev-synasync
          fi

      - name: Notify Discord - Deploy Triggered
        run: |
          curl -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "🧪 테스트 CI 성공 & 배포 트리거 완료 (Sync/Async)",
                "description": "**업데이트 서비스:** `${{ needs.detect-changes.outputs.services }}`\n**이미지 태그:** `test-synasync-${{ github.sha }}`\n**브랜치:** `test/syn-async`",
                "color": 10181046,
                "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"
              }]
            }'

  # ============================================
  # Job 4: 빌드 결과 요약
  # ============================================
  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [detect-changes, build, deploy-update]
    if: always() && needs.detect-changes.outputs.services != ''
    
    steps:
      - name: Generate build summary
        run: |
          IMAGE_TAG="test-synasync-${{ github.sha }}"
          
          echo "## 🧪 테스트 CI/CD 빌드 및 배포 결과 (Sync/Async)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 배포 정보" >> $GITHUB_STEP_SUMMARY
          echo "- **대상 환경:** DEV (테스트용)" >> $GITHUB_STEP_SUMMARY
          echo "- **이미지 태그:** \`${IMAGE_TAG}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **인프라 브랜치:** \`feat/ArgoCD-dev-synasync\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### 🛠️ 서비스별 상태" >> $GITHUB_STEP_SUMMARY
          echo "| 서비스 | 빌드 상태 | 배포 트리거 |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|----------|------------|" >> $GITHUB_STEP_SUMMARY
          
          SERVICES="${{ needs.detect-changes.outputs.services }}"
          IFS=',' read -ra SERVICE_ARRAY <<< "$SERVICES"
          
          for SERVICE in "${SERVICE_ARRAY[@]}"; do
            if [ "${{ needs.build.result }}" = "success" ]; then
              B_STATUS="✅ 성공"
            else
              B_STATUS="❌ 실패"
            fi
            
            if [ "${{ needs.deploy-update.result }}" = "success" ]; then
              D_STATUS="🚀 완료"
            else
              D_STATUS="⚠️ 중단/실패"
            fi
            
            echo "| $SERVICE | $B_STATUS | $D_STATUS |" >> $GITHUB_STEP_SUMMARY
          done
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 유용한 링크" >> $GITHUB_STEP_SUMMARY
          echo "- [AWS ECR 콘솔](https://ap-northeast-2.console.aws.amazon.com/ecr/repositories)" >> $GITHUB_STEP_SUMMARY

      - name: Notify Discord - Pipeline Complete
        run: |
          SERVICES="${{ needs.detect-changes.outputs.services }}"
          SERVICE_COUNT=$(echo "$SERVICES" | tr ',' '\n' | wc -l)
          
          if [ "${{ needs.build.result }}" = "success" ] && [ "${{ needs.deploy-update.result }}" = "success" ]; then
            TITLE="✅ 테스트 CI/CD 완료 - ${SERVICE_COUNT}개 서비스 (Sync/Async)"
            COLOR=10181046
            STATUS="모든 서비스 빌드 및 배포 트리거 성공"
          else
            TITLE="⚠️ 테스트 CI/CD 완료 - 일부 실패/중단"
            COLOR=16776960
            STATUS="일부 서비스 확인 필요"
          fi
          
          curl -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "'"$TITLE"'",
                "description": "**환경:** DEV (테스트)\n**브랜치:** `test/syn-async`\n**커밋:** `${{ github.sha }}`\n**대상:** '"$SERVICES"'\n**결과:** '"$STATUS"'",
                "color": '"$COLOR"',
                "footer": {
                  "text": "ArgoCD에서 최종 배포 상태를 확인하세요."
                },
                "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"
              }]
            }'
