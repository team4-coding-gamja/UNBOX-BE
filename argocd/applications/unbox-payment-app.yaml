apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: unbox-payment
  namespace: argocd
  labels:
    app.kubernetes.io/name: unbox-payment
    app.kubernetes.io/part-of: unbox-platform
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  
  # Git 소스 설정
  source:
    repoURL: https://github.com/your-org/UNBOX-BE.git  # 실제 Git 저장소 URL로 변경 필요
    targetRevision: HEAD
    path: helm/unbox-service
    helm:
      valueFiles:
        - ../values-payment-local.yaml
      parameters:
        - name: image.tag
          value: "latest"  # CI에서 동적으로 업데이트됨
        - name: rollouts.enabled
          value: "true"
        - name: rollouts.strategy
          value: "canary"
  
  # 배포 대상 클러스터
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  
  # 동기화 정책 (Canary 전략)
  syncPolicy:
    automated:
      prune: true
      selfHeal: true  # Canary는 자동 진행 가능
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 10m
  
  # Canary 배포 설정
  ignoreDifferences:
    - group: argoproj.io
      kind: Rollout
      jsonPointers:
        - /spec/replicas
        - /status
        - /spec/template/spec/containers/0/image
  
  revisionHistoryLimit: 10