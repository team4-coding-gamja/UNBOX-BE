services:
  # 1. User Service (formerly unbox_be)
  unbox-user:
    build:
      context: .
      dockerfile: unbox_user/Dockerfile
    platform: linux/amd64  # <--- 추가됨: Mac 호환성 해결
    container_name: unbox-user
    ports:
      - "8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_URL=jdbc:postgresql://db:5432/unbox_user
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_JWT_SECRET=${SPRING_JWT_SECRET}
      - DB_DRIVER_CLASS_NAME=org.postgresql.Driver
      - ORDER_SERVICE_URL=http://unbox-order:8080
      - PAYMENT_SERVICE_URL=http://unbox-payment:8080
      - TRADE_SERVICE_URL=http://unbox-trade:8080
      - PRODUCT_SERVICE_URL=http://unbox-product:8080
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL=PLAINTEXT
      - MAIL_HOST=${MAIL_HOST:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_FROM=${MAIL_FROM:-noreply@unbox.com}
      - TEMPO_OTLP_ENDPOINT=http://tempo:4318/v1/traces
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24224
        tag: unbox-user
        fluentd-async: "true"
    depends_on:
      - db
      - redis
      - fluent-bit

  # 2. Product Service
  unbox-product:
    build:
      context: .
      dockerfile: unbox_product/Dockerfile
    platform: linux/amd64  # <--- 추가됨
    container_name: unbox-product
    ports:
      - "8082:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_URL=jdbc:postgresql://db:5432/unbox_product
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_JWT_SECRET=${SPRING_JWT_SECRET}
      - DB_DRIVER_CLASS_NAME=org.postgresql.Driver
      - ORDER_SERVICE_URL=http://unbox-order:8080
      - PAYMENT_SERVICE_URL=http://unbox-payment:8080
      - TRADE_SERVICE_URL=http://unbox-trade:8080
      - USER_SERVICE_URL=http://unbox-user:8080
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL=PLAINTEXT
      - TEMPO_OTLP_ENDPOINT=http://tempo:4318/v1/traces
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24224
        tag: unbox-product
        fluentd-async: "true"
    depends_on:
      - db
      - redis
      - fluent-bit

  # 3. Trade Service
  unbox-trade:
    build:
      context: .
      dockerfile: unbox_trade/Dockerfile
    platform: linux/amd64  # <--- 추가됨
    container_name: unbox-trade
    ports:
      - "8083:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_URL=jdbc:postgresql://db:5432/unbox_trade
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_JWT_SECRET=${SPRING_JWT_SECRET}
      - DB_DRIVER_CLASS_NAME=org.postgresql.Driver
      - PRODUCT_SERVICE_URL=http://unbox-product:8080
      - USER_SERVICE_URL=http://unbox-user:8080
      - ORDER_SERVICE_URL=http://unbox-order:8080
      - PAYMENT_SERVICE_URL=http://unbox-payment:8080
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL=PLAINTEXT
      - TEMPO_OTLP_ENDPOINT=http://tempo:4318/v1/traces
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24224
        tag: unbox-trade
        fluentd-async: "true"
    depends_on:
      - db
      - redis
      - fluent-bit

  # 4. Payment Service
  unbox-payment:
    build:
      context: .
      dockerfile: unbox_payment/Dockerfile
    platform: linux/amd64  # <--- 추가됨
    container_name: unbox-payment
    ports:
      - "8085:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_URL=jdbc:postgresql://db:5432/unbox_payment
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_JWT_SECRET=${SPRING_JWT_SECRET}
      - DB_DRIVER_CLASS_NAME=org.postgresql.Driver
      - PRODUCT_SERVICE_URL=http://unbox-product:8080
      - USER_SERVICE_URL=http://unbox-user:8080
      - TRADE_SERVICE_URL=http://unbox-trade:8080
      - ORDER_SERVICE_URL=http://unbox-order:8080
      - TOSS_SECRET_KEY=${TOSS_SECRET_KEY}
      - TOSS_SECURITY_KEY=${TOSS_SECURITY_KEY}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL=PLAINTEXT
      - TEMPO_OTLP_ENDPOINT=http://tempo:4318/v1/traces
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24224
        tag: unbox-payment
        fluentd-async: "true"
    depends_on:
      - db
      - redis
      - fluent-bit

  # 5. Order Service
  unbox-order:
    build:
      context: .
      dockerfile: unbox_order/Dockerfile
    platform: linux/amd64  # <--- 추가됨
    container_name: unbox-order
    ports:
      - "8084:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_URL=jdbc:postgresql://db:5432/unbox_order
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_JWT_SECRET=${SPRING_JWT_SECRET}
      - DB_DRIVER_CLASS_NAME=org.postgresql.Driver
      - USER_SERVICE_URL=http://unbox-user:8080
      - TRADE_SERVICE_URL=http://unbox-trade:8080
      - PAYMENT_SERVICE_URL=http://unbox-payment:8080
      - PRODUCT_SERVICE_URL=http://unbox-product:8080
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL=PLAINTEXT
      - TEMPO_OTLP_ENDPOINT=http://tempo:4318/v1/traces
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24224
        tag: unbox-order
        fluentd-async: "true"
    depends_on:
      - db
      - redis
      - fluent-bit

  # 15. AI Service (Python FastAPI)
  unbox-ai:
    build:
      context: .
      dockerfile: unbox_ai/Dockerfile
    platform: linux/amd64
    container_name: unbox-ai
    ports:
      - "8000:8000"  # FastAPI 기본 포트
    environment:
      # Python Config에서 읽어갈 환경 변수들
      - PROJECT_NAME=UNBOX-AI
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=unbox_ai   # 주의: 이 DB가 생성되어 있어야 함 (아래 설명 참조)
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET_KEY=${SPRING_JWT_SECRET}
      # 추후 Kafka 연동을 위해 미리 추가
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      - db
      - kafka
    # 다른 Java 서비스들과 로깅 환경 통일 (Fluentd -> Loki)
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24224
        tag: unbox-ai
        fluentd-async: "true"

  # 6. PostgreSQL
  db:
    image: postgres:16.11-alpine
    container_name: unbox-postgres
    platform: linux/amd64
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./postgres_init:/docker-entrypoint-initdb.d

  # 7. Redis
  redis:
    image: redis:alpine
    container_name: unbox-redis
    # Redis는 보통 멀티 아키텍처를 지원하므로 platform 지정이 필수는 아니지만,
    # 만약 에러가 난다면 여기에도 platform: linux/amd64를 추가하세요.
    ports:
      - "6379:6379"
    volumes:
      - ./redis_data:/data

  # 8. Kafka (KRaft Mode) - Lightweight
  kafka:
    image: apache/kafka:3.7.0
    container_name: unbox-kafka
    platform: linux/amd64
    ports:
      - "9092:9092"
    environment:
      # KRaft Settings
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'

  # 9. Kafka UI
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: unbox-kafka-ui
    platform: linux/amd64
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: unbox-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: PLAINTEXT
    depends_on:
      - kafka

  # 10. Tempo (For Distributed Tracing - LGTM Stack)
  tempo:
    image: grafana/tempo:2.3.1
    container_name: unbox-tempo
    platform: linux/amd64
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo-config.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"   # Tempo query frontend
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

  # 11. Prometheus (Metrics Collection)
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: unbox-prometheus
    platform: linux/amd64
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    depends_on:
      - unbox-user
      - unbox-product
      - unbox-order
      - unbox-trade
      - unbox-payment

  # 12. Loki (Log Aggregation)
  loki:
    image: grafana/loki:2.9.3
    container_name: unbox-loki
    platform: linux/amd64
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/loki-config.yaml

  # 13. Fluent-bit (Log Collector)
  fluent-bit:
    image: fluent/fluent-bit:2.2
    container_name: unbox-fluent-bit
    platform: linux/amd64
    ports:
      - "24224:24224"
      - "24224:24224/udp"
    volumes:
      - ./fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
    depends_on:
      - loki

  # 14. Grafana (Visualization Dashboard)
  grafana:
    image: grafana/grafana:10.2.3
    container_name: unbox-grafana
    platform: linux/amd64
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    depends_on:
      - tempo
      - prometheus
      - loki

volumes:
  tempo_data:
  grafana_data:
  prometheus_data:
  loki_data: