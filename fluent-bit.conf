# Fluent-bit Configuration - Forward Protocol (Windows Compatible)
[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info

# Receive logs from Docker via fluentd protocol
[INPUT]
    Name         forward
    Listen       0.0.0.0
    Port         24224

# Output to Loki - use tag as service name
[OUTPUT]
    Name         loki
    Match        *
    Host         loki
    Port         3100
    Labels       job=docker,tag=$tag
    Line_format  json
