# unbox-payment 로컬 배포용 설정

service:
  name: unbox-payment
  port: 8085
  targetPort: 8085

image:
  repository: k3d-unbox-registry:5000/unbox-payment
  tag: b5bff58
  pullPolicy: Always

env:
  - name: SPRING_PROFILES_ACTIVE
    value: "local"
  - name: SPRING_APPLICATION_NAME
    value: "unbox-payment"
  - name: SERVER_PORT
    value: "8085"
  - name: MANAGEMENT_ZIPKIN_TRACING_ENDPOINT
    value: "http://zipkin.monitoring.svc.cluster.local:9411/api/v2/spans"
  - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
    value: "health,info,metrics,prometheus"
  - name: MANAGEMENT_TRACING_SAMPLING_PROBABILITY
    value: "1.0"
  - name: SPRING_JWT_SECRET
    value: "/zLs4Tf5vCe9VA/yX6omomrza7Y+4KHDgkkUFwWqIDz7uK7shp1eDwpbTvm+pfynlnc/eUZo3AySkNIqQSWSrw=="
  - name: SPRING_DATASOURCE_URL
    value: "jdbc:postgresql://postgresql.default.svc.cluster.local:5432/unbox"
  - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
    value: "org.postgresql.Driver"
  - name: SPRING_DATASOURCE_USERNAME
    value: "postgres"
  - name: SPRING_DATASOURCE_PASSWORD
    value: "password"
  - name: SPRING_JPA_DATABASE_PLATFORM
    value: "org.hibernate.dialect.PostgreSQLDialect"
  - name: SPRING_JPA_HIBERNATE_DDL_AUTO
    value: "update"
  - name: SPRING_H2_CONSOLE_ENABLED
    value: "false"
  - name: SPRING_DATA_REDIS_HOST
    value: "redis-master.default.svc.cluster.local"
  - name: SPRING_DATA_REDIS_PORT
    value: "6379"
  - name: TOSS_SECRET_KEY
    value: "test_sk_dummy_key_for_local"
  - name: TOSS_SECURITY_KEY
    value: "test_security_dummy_key_for_local"
  - name: KAFKA_BOOTSTRAP_SERVERS
    value: "kafka.default.svc.cluster.local:9092"
  - name: SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL
    value: "PLAINTEXT"

# 헬스체크 설정
healthCheck:
  enabled: true
  path: /payment/actuator/health
  initialDelaySeconds: 120
  periodSeconds: 15
  timeoutSeconds: 10
  failureThreshold: 10

# 관측성 설정 (Prometheus 메트릭 수집용)
observability:
  metrics:
    enabled: true
    port: 8085
    path: /payment/actuator/prometheus

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
  hosts:
    - host: localhost
      paths:
        - path: /api/v1/payment(/|$)(.*)
          pathType: Prefix

# Canary 배포 전략 (ArgoCD Rollouts)
rollouts:
  enabled: false  # 일단 기본 Deployment 사용
  strategy: canary
  canary:
    maxSurge: "25%"
    maxUnavailable: 0
    steps:
    - setWeight: 20
    - pause: {duration: 10s}
    - setWeight: 40
    - pause: {duration: 10s}
    - setWeight: 60
    - pause: {duration: 10s}
    - setWeight: 80
    - pause: {duration: 10s}
    analysis:
      templates:
      - templateName: success-rate
      args:
      - name: service-name
        value: unbox-payment
      startingStep: 2
      interval: 20s
      count: 3
      successCondition: result[0] >= 0.95
      failureCondition: result[0] < 0.95