# Payment Service Rolling Update 테스트 설정
# 시나리오: Toss Payment API 키 변경으로 인한 결제 실패

service:
  name: unbox-payment
  port: 8085
  targetPort: 8085

image:
  repository: k3d-unbox-registry:5000/unbox-payment
  tag: b5bff58
  pullPolicy: Always

env:
  - name: SPRING_PROFILES_ACTIVE
    value: "local"
  - name: SPRING_APPLICATION_NAME
    value: "unbox-payment"
  - name: SERVER_PORT
    value: "8085"
  - name: MANAGEMENT_ZIPKIN_TRACING_ENDPOINT
    value: "http://zipkin.monitoring.svc.cluster.local:9411/api/v2/spans"
  - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
    value: "health,info,metrics,prometheus"
  - name: MANAGEMENT_TRACING_SAMPLING_PROBABILITY
    value: "1.0"
  - name: SPRING_JWT_SECRET
    value: "/zLs4Tf5vCe9VA/yX6omomrza7Y+4KHDgkkUFwWqIDz7uK7shp1eDwpbTvm+pfynlnc/eUZo3AySkNIqQSWSrw=="
  - name: SPRING_DATASOURCE_URL
    value: "jdbc:postgresql://postgresql.default.svc.cluster.local:5432/unbox"
  - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
    value: "org.postgresql.Driver"
  - name: SPRING_DATASOURCE_USERNAME
    value: "postgres"
  - name: SPRING_DATASOURCE_PASSWORD
    value: "password"
  - name: SPRING_JPA_DATABASE_PLATFORM
    value: "org.hibernate.dialect.PostgreSQLDialect"
  - name: SPRING_JPA_HIBERNATE_DDL_AUTO
    value: "update"
  - name: SPRING_H2_CONSOLE_ENABLED
    value: "false"
  - name: SPRING_DATA_REDIS_HOST
    value: "redis-master.default.svc.cluster.local"
  - name: SPRING_DATA_REDIS_PORT
    value: "6379"
  # 🔑 변경된 Toss Payment API 키 (Rolling Update 테스트용)
  - name: TOSS_SECRET_KEY
    value: "test_sk_NEW_UPDATED_ROLLING_UPDATE_KEY_V2_2024"
  - name: TOSS_SECURITY_KEY
    value: "test_security_NEW_ROLLING_UPDATE_KEY_V2_2024"
  # Kafka 설정
  - name: KAFKA_BOOTSTRAP_SERVERS
    value: "kafka.default.svc.cluster.local:9092"
  - name: SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL
    value: "PLAINTEXT"
  # Consumer Group 변경 (Rolling Update 테스트용)
  - name: SPRING_KAFKA_CONSUMER_GROUP_ID
    value: "payment-group-v2"

# 헬스체크 설정
healthCheck:
  enabled: true
  path: /payment/actuator/health
  initialDelaySeconds: 120
  periodSeconds: 15
  timeoutSeconds: 10
  failureThreshold: 10

# Rolling Update 전략
rollingUpdate:
  maxUnavailable: 0
  maxSurge: 1

# 관측성 설정
observability:
  metrics:
    enabled: true
    port: 8085
    path: /payment/actuator/prometheus

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
  hosts:
    - host: localhost
      paths:
        - path: /api/v1/payment(/|$)(.*)
          pathType: Prefix

# Rolling Update 사용 (Blue-Green 비활성화)
rollouts:
  enabled: false