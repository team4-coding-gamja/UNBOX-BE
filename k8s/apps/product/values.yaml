# 1. 앱 기본 정보
appName: product-service
replicaCount: 1
image:
  repository: unbox_product  # 로컬 도커 이미지 이름
  tag: v1                   # 태그
  pullPolicy: IfNotPresent

# 2. 로컬이니까 Linkerd 끄기 (테스트할 때만 true)
linkerd:
  enabled: false
service:
  port: 80
  targetPort: 8082

containerPort: 8082

env:
  SERVER_PORT: "8082"
  SPRING_JWT_SECRET: "c2VjcmV0S2V5Rm9yTG9jYWxEZXZlbG9wbWVudFRoaXNJc1ZlcnlJbXBvcnRhbnQ="
  DB_DRIVER_CLASS_NAME: "org.postgresql.Driver"
  # DB 연결 (아까 설치한 postgres 서비스명 사용)
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-postgresql.unbox-db.svc.cluster.local:5432/unbox"
  SPRING_DATASOURCE_USERNAME: "unbox_admin"
  SPRING_DATASOURCE_PASSWORD: "1234"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  
  # (참고) SQL 쿼리 나가는 거 보고 싶으면 이것도 추가
  SPRING_JPA_SHOW_SQL: "true"
  # Kafka 연결 (아까 설치한 kafka 서비스명 사용)
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka.unbox-infra.svc.cluster.local:9092"
  
  # Redis 연결 (아까 설치한 redis 서비스명 사용)
  SPRING_DATA_REDIS_HOST: "redis-master.unbox-db.svc.cluster.local"
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_DATA_REDIS_PASSWORD: "1234"
  
  # Zipkin 연결
  MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: "http://zipkin.unbox-infra.svc.cluster.local:9411/api/v2/spans"