apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: payment-bluegreen-analysis
  namespace: unbox-app
  labels:
    app: payment-service
spec:
  args:
    - name: service-name
      value: payment-service
  metrics:
    # Success Rate 체크 (99.5% 이상)
    - name: success-rate
      initialDelay: 10s
      interval: 10s
      count: 18  # 3분간 분석 (10초 * 18회)
      failureLimit: 3
      inconclusiveLimit: 2
      failureCondition: |
        result[0] < 99.5
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.monitoring:9090
          query: |
            sum(rate(
              http_server_requests_seconds_count{
                job="unbox-payment-service",
                status!~"5.."
              }[1m]
            )) 
            / 
            sum(rate(
              http_server_requests_seconds_count{
                job="unbox-payment-service"
              }[1m]
            )) * 100
    
    # Error Rate 체크 (0.5% 이하)
    - name: error-rate
      initialDelay: 10s
      interval: 10s
      count: 18  # 3분간 분석
      failureLimit: 3
      inconclusiveLimit: 2
      failureCondition: |
        result[0] > 0.5
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.monitoring:9090
          query: |
            (
              sum(rate(
                http_server_requests_seconds_count{
                  job="unbox-payment-service",
                  status=~"5.."
                }[1m]
              )) 
              / 
              sum(rate(
                http_server_requests_seconds_count{
                  job="unbox-payment-service"
                }[1m]
              )) * 100
            ) or vector(0)
    
    # Response Time 체크 (500ms 이하)
    - name: avg-response-time
      initialDelay: 10s
      interval: 10s
      count: 18  # 3분간 분석
      failureLimit: 3
      inconclusiveLimit: 2
      failureCondition: |
        result[0] > 500
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.monitoring:9090
          query: |
            sum(rate(
              http_server_requests_seconds_sum{
                job="unbox-payment-service"
              }[1m]
            )) 
            / 
            sum(rate(
              http_server_requests_seconds_count{
                job="unbox-payment-service"
              }[1m]
            )) * 1000
